<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">DayMate 個人日程與薪資管理助手</title>
  <desc id="desc">以課程、班表、薪資、生活費與筆記組成的個人日常管理流程。</desc>
  <defs>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9H18M9 0V18" stroke="#dcd0c2" stroke-width="1" opacity=".48"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#e6e2d8"/>
  <rect width="1200" height="390" rx="28" fill="url(#weave)"/>
  <path d="M64 84H566" stroke="#b87e6b" stroke-width="5" stroke-linecap="round"/>
  <text x="64" y="57" fill="#5f7186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">PERSONAL PLANNING WORKSPACE</text>
  <text x="64" y="155" fill="#3d3a36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif" font-size="72" font-weight="800">DayMate</text>
  <text x="64" y="202" fill="#3d3a36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif" font-size="30" font-weight="700">把課程、班表與薪資放回同一個日常節奏。</text>
  <text x="64" y="244" fill="#5f6368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif" font-size="22">學生與兼職工作者的日程、記帳與提醒工具</text>
  <g transform="translate(64 286)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif" font-size="18" font-weight="700">
    <rect width="128" height="44" rx="22" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2"/>
    <text x="64" y="29" text-anchor="middle" fill="#3d3a36">Next.js</text>
    <rect x="142" width="128" height="44" rx="22" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2"/>
    <text x="206" y="29" text-anchor="middle" fill="#3d3a36">TypeScript</text>
    <rect x="284" width="128" height="44" rx="22" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2"/>
    <text x="348" y="29" text-anchor="middle" fill="#3d3a36">Firebase</text>
  </g>
  <g transform="translate(676 34)">
    <rect width="462" height="322" rx="24" fill="#f0ece1" stroke="#dcd0c2" stroke-width="2"/>
    <text x="32" y="46" fill="#3d3a36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif" font-size="24" font-weight="800">今日的安排</text>
    <text x="32" y="76" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">WED · 08 / 27</text>
    <g transform="translate(32 96)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif">
      <rect width="398" height="48" rx="12" fill="#e7d8d1"/>
      <rect width="9" height="48" rx="4" fill="#b87e6b"/>
      <text x="28" y="31" fill="#3d3a36" font-size="20" font-weight="700">09:10　資料結構</text>
      <rect y="62" width="398" height="48" rx="12" fill="#dce3ea"/>
      <rect width="9" height="48" rx="4" fill="#5f7186" transform="translate(0 62)"/>
      <text x="28" y="93" fill="#3d3a36" font-size="20" font-weight="700">14:00　兼職班別</text>
      <rect y="124" width="190" height="76" rx="16" fill="#fffdf8" stroke="#dcd0c2" stroke-width="2"/>
      <text x="20" y="153" fill="#5f6368" font-size="18" font-weight="700">本月薪資</text>
      <text x="20" y="187" fill="#3d3a36" font-size="32" font-weight="800">$ 12,800</text>
      <rect x="208" y="124" width="190" height="76" rx="16" fill="#fffdf8" stroke="#dcd0c2" stroke-width="2"/>
      <text x="228" y="153" fill="#5f6368" font-size="18" font-weight="700">待完成</text>
      <path d="M230 187 L258 160 L284 173 L318 135 L350 153 L378 128" fill="none" stroke="#b87e6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
